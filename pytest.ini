[pytest]
# Registering the marker silences "unknown mark" warnings. The brain/model-
# loading modules are auto-tagged `slow` by tests/conftest.py, so:
#   pytest                 -> everything (default)
#   pytest -m "not slow"   -> fast lane: the 1000+ pure-logic tests, seconds
#   pytest -m slow         -> only the heavy brain/model tests
markers =
    slow: loads the encoder / neural model / full engine (slow; brain warm-up)
testpaths = tests
