<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A.E.R.I.S — AI Assistant v3.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
  #root { width: 100%; height: 100%; }

  /* ── Keyframes ── */
  @keyframes aeris-spin      { from { transform: rotate(0deg);    } to { transform: rotate(360deg);   } }
  @keyframes aeris-spin-rev  { from { transform: rotate(0deg);    } to { transform: rotate(-360deg);  } }
  @keyframes aeris-pulse     { 0%,100% { opacity:1; transform:scale(1);    } 50% { opacity:0.65; transform:scale(0.93); } }
  @keyframes aeris-ripple    { 0%   { transform:scale(0.75); opacity:0.8;  } 100% { transform:scale(2.4); opacity:0; } }
  @keyframes aeris-blink     { 0%,100% { opacity:1; } 50% { opacity:0.15; } }
  @keyframes aeris-cursor    { 0%,100% { opacity:1; } 50% { opacity:0;    } }
  @keyframes aeris-wavebar   { 0%,100% { transform:scaleY(0.28); } 50% { transform:scaleY(1); } }
  @keyframes aeris-fadein    { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes aeris-scan      { 0% { transform:translateY(0); } 100% { transform:translateY(900px); } }
  @keyframes aeris-glow-green {
    0%,100% { box-shadow: 0 0 8px rgba(16,185,129,0.4);  }
    50%      { box-shadow: 0 0 22px rgba(16,185,129,0.9), 0 0 40px rgba(16,185,129,0.3); }
  }

  /* ── Scrollbars ── */
  ::-webkit-scrollbar       { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 2px; }

  /* ── Input reset ── */
  input::placeholder { color: rgb(100,116,139); }
  input:disabled::placeholder { color: rgb(60,75,95); }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Load modules in dependency order -->
<script type="text/babel" src="aeris-core.jsx"></script>
<script type="text/babel" src="aeris-reactor.jsx"></script>
<script type="text/babel" src="aeris-logs.jsx"></script>
<script type="text/babel" src="aeris-chat.jsx"></script>
<script type="text/babel" src="aeris-sidebar.jsx"></script>
<script type="text/babel" src="aeris-app.jsx"></script>
</body>
</html>
